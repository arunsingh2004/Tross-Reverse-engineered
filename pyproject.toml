[project]
name = "linkedin-profile-api"
version = "0.1.0"
description = "Flask API for retrieving normalized LinkedIn profiles."
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=23,<24",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "truststore>=0.10.4,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
